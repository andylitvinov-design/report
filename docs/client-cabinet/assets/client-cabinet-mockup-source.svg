<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg{fill:#F7F3EA}.card{fill:#fff;stroke:#E4DCCF;stroke-width:2}.soft{fill:#EAF3E2}.green{fill:#3F7A3D}.orange{fill:#D78322}.blue{fill:#3E72C7}.muted{fill:#777066}.text{fill:#1F1F1F}.title{font:700 30px Arial}.h2{font:700 22px Arial}.body{font:400 16px Arial}.small{font:400 13px Arial}.bold{font:700 16px Arial}.tiny{font:400 11px Arial}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text x="56" y="54" class="title">Holistic Therapy Cabinet — Design Source Mockup</text>
  <text x="56" y="82" class="body muted">Desktop + mobile layout reference. This SVG is a concrete source-of-truth mockup.</text>

  <!-- desktop canvas -->
  <g transform="translate(56 120)">
    <rect class="card" width="1040" height="760" rx="32"/>
    <text x="32" y="46" class="h2">Desktop / Обзор</text>

    <!-- sidebar -->
    <rect x="24" y="78" width="190" height="650" rx="26" fill="#FBF8F1" stroke="#E4DCCF" stroke-width="2"/>
    <circle cx="62" cy="120" r="20" class="soft"/><text x="55" y="126" class="bold green">☘</text>
    <text x="90" y="116" class="bold">Holistic</text><text x="90" y="136" class="small muted">Therapy Cabinet</text>
    <rect x="42" y="172" width="150" height="38" rx="12" class="soft"/><text x="58" y="196" class="bold green">Обзор</text>
    <text x="58" y="245" class="body muted">Самоанализ</text>
    <text x="58" y="292" class="body muted">Экспертный анализ</text>
    <text x="58" y="339" class="body muted">Рекомендации</text>
    <text x="58" y="386" class="body muted">Динамика / История</text>
    <rect x="42" y="650" width="150" height="52" rx="16" fill="#FFFFFF" stroke="#E4DCCF"/><text x="58" y="673" class="bold">Анна</text><text x="58" y="692" class="small muted">ID C-1024</text>

    <!-- header -->
    <rect x="240" y="78" width="520" height="86" rx="24" class="card"/>
    <text x="264" y="115" class="h2">Обзор состояния</text>
    <text x="264" y="142" class="small muted">Фокус: здоровье / тело · Последний срез: 14.05</text>
    <rect x="780" y="78" width="220" height="86" rx="24" fill="#3F7A3D"/><text x="824" y="130" font-family="Arial" font-size="18" font-weight="700" fill="#fff">+ Новая оценка</text>

    <!-- top tabs -->
    <rect x="240" y="184" width="760" height="56" rx="20" fill="#FBF8F1" stroke="#E4DCCF"/>
    <rect x="256" y="196" width="124" height="32" rx="12" class="soft"/><text x="282" y="217" class="bold green">Состояние</text>
    <text x="412" y="217" class="body muted">Графики</text><text x="510" y="217" class="body muted">Следующий шаг</text><text x="650" y="217" class="body muted">Комментарий</text>

    <!-- metric cards -->
    <g transform="translate(240 264)">
      <rect class="card" width="170" height="120" rx="22"/><text x="18" y="32" class="small muted">Сила проблемы</text><text x="18" y="78" font-family="Arial" font-size="34" font-weight="800" fill="#D78322">7/10</text><text x="18" y="102" class="small muted">умеренно высокая</text>
      <rect x="190" class="card" width="170" height="120" rx="22"/><text x="208" y="32" class="small muted">Общий ресурс</text><text x="208" y="78" font-family="Arial" font-size="34" font-weight="800" fill="#3E72C7">4/10</text><text x="208" y="102" class="small muted">ниже среднего</text>
      <rect x="380" class="card" width="170" height="120" rx="22"/><text x="398" y="32" class="small muted">Главный препарат</text><text x="398" y="78" font-family="Arial" font-size="28" font-weight="800" fill="#3F7A3D">Olive</text><text x="398" y="102" class="small muted">ресурс</text>
      <rect x="570" class="card" width="190" height="120" rx="22"/><text x="588" y="32" class="small muted">Bottleneck</text><text x="588" y="78" font-family="Arial" font-size="30" font-weight="800" fill="#D78322">Земля</text><text x="588" y="102" class="small muted">опора</text>
    </g>

    <!-- chart -->
    <rect x="240" y="410" width="470" height="210" rx="24" class="card"/>
    <text x="264" y="446" class="h2">Динамика последних срезов</text>
    <polyline points="270,555 360,535 450,510 540,490 680,455" fill="none" stroke="#3E72C7" stroke-width="5"/>
    <polyline points="270,468 360,486 450,505 540,518 680,540" fill="none" stroke="#D78322" stroke-width="5"/>
    <text x="264" y="596" class="small muted">Синий — ресурс растёт · Оранжевый — напряжение снижается</text>

    <!-- recommendations -->
    <rect x="240" y="642" width="470" height="86" rx="24" class="card"/>
    <text x="264" y="676" class="h2">Формула поддержки</text>
    <text x="264" y="705" class="body muted">Olive · Elm · White Chestnut · повторная проверка через 7 дней</text>

    <!-- right comment -->
    <rect x="734" y="410" width="266" height="318" rx="26" class="card"/>
    <circle cx="768" cy="450" r="22" fill="#E7D5B8"/><text x="802" y="446" class="bold">Комментарий специалиста</text><text x="802" y="466" class="small muted">Андрей Ли · сегодня</text>
    <text x="758" y="512" class="body">Сейчас главное —</text><text x="758" y="536" class="body">не усиливать нагрузку,</text><text x="758" y="560" class="body">а восстановить</text><text x="758" y="584" class="body">базовую опору.</text>
    <rect x="758" y="642" width="210" height="48" rx="16" class="green"/><text x="790" y="672" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Повторный анализ</text>
  </g>

  <!-- mobile canvas -->
  <g transform="translate(1140 120)">
    <rect class="card" width="360" height="760" rx="38"/>
    <text x="28" y="48" class="h2">Mobile / Обзор</text>
    <rect x="24" y="74" width="312" height="62" rx="24" fill="#FBF8F1" stroke="#E4DCCF"/>
    <circle cx="58" cy="105" r="17" class="soft"/><text x="84" y="101" class="bold">Holistic Therapy</text><text x="84" y="121" class="small muted">Кабинет натуральной терапии</text>

    <rect x="24" y="156" width="312" height="92" rx="24" class="card"/>
    <text x="48" y="190" class="h2">Анна</text><text x="48" y="216" class="small muted">Фокус: здоровье / тело · ID C-1024</text>

    <rect x="24" y="268" width="146" height="100" rx="22" class="card"/><text x="44" y="300" class="small muted">Проблема</text><text x="44" y="342" font-family="Arial" font-size="31" font-weight="800" fill="#D78322">7/10</text>
    <rect x="190" y="268" width="146" height="100" rx="22" class="card"/><text x="210" y="300" class="small muted">Ресурс</text><text x="210" y="342" font-family="Arial" font-size="31" font-weight="800" fill="#3E72C7">4/10</text>

    <rect x="24" y="388" width="312" height="118" rx="24" class="card"/>
    <text x="48" y="422" class="h2">Главное сейчас</text><text x="48" y="454" class="body muted">Olive · Земля · восстановить опору</text><rect x="48" y="472" width="220" height="10" rx="5" fill="#EAF3E2"/><rect x="48" y="472" width="150" height="10" rx="5" class="orange"/>

    <rect x="24" y="526" width="312" height="128" rx="24" class="card"/>
    <text x="48" y="560" class="h2">Комментарий</text><text x="48" y="592" class="body">Не усиливать нагрузку.</text><text x="48" y="616" class="body">Сначала вернуть ресурс.</text>

    <rect x="24" y="676" width="312" height="52" rx="22" class="green"/><text x="84" y="709" font-family="Arial" font-size="17" font-weight="700" fill="#fff">Пройти самоанализ</text>
  </g>
</svg>