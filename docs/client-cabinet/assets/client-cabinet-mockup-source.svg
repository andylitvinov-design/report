<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Client Cabinet overview mockup source</title>
  <desc id="desc">Desktop and mobile overview screens for the Holistic Therapy client cabinet.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#f0eadc"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60796b"/>
      <stop offset="1" stop-color="#2f4a42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#24382f" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #efe7d7; }
      .screen { fill: url(#paper); stroke: #d8cbb6; stroke-width: 1.5; filter: url(#shadow); }
      .nav { fill: #263a34; }
      .nav-muted { fill: #9ca99b; }
      .ink { fill: #24312d; }
      .muted { fill: #7b877d; }
      .line { stroke: #d8cbb6; stroke-width: 1.5; }
      .soft { fill: #f7f2e8; stroke: #ddd1be; stroke-width: 1.2; }
      .panel { fill: #fffdf8; stroke: #d9ccba; stroke-width: 1.2; }
      .accent { fill: #b88a55; }
      .sage { fill: url(#sage); }
      .rose { fill: #c98b7c; }
      .gold { fill: #d8b56a; }
      .text-xl { font: 700 36px Georgia, serif; letter-spacing: 0; }
      .text-lg { font: 700 22px Georgia, serif; letter-spacing: 0; }
      .text-md { font: 600 15px Arial, sans-serif; letter-spacing: 0; }
      .text-sm { font: 500 12px Arial, sans-serif; letter-spacing: 0; }
      .text-xs { font: 500 10px Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1080"/>

  <g transform="translate(80 72)">
    <rect class="screen" width="960" height="680" rx="28"/>
    <rect class="nav" x="0" y="0" width="196" height="680" rx="28"/>
    <rect class="nav" x="166" y="0" width="30" height="680"/>
    <text x="34" y="58" class="text-md" fill="#f6efe0">Alchemy Cabinet</text>
    <text x="34" y="82" class="text-xs" fill="#b8c4b7">Holistic Therapy</text>
    <rect x="24" y="130" width="148" height="38" rx="12" fill="#f5ead7" opacity="0.14"/>
    <circle cx="44" cy="149" r="5" fill="#d8b56a"/>
    <text x="60" y="153" class="text-sm" fill="#f6efe0">Overview</text>
    <text x="60" y="204" class="text-sm nav-muted">Reports</text>
    <text x="60" y="250" class="text-sm nav-muted">Questionnaires</text>
    <text x="60" y="296" class="text-sm nav-muted">Sessions</text>
    <text x="60" y="342" class="text-sm nav-muted">Messages</text>
    <rect x="24" y="570" width="148" height="54" rx="16" fill="#334d45"/>
    <text x="42" y="594" class="text-xs" fill="#cfd8cf">Next session</text>
    <text x="42" y="614" class="text-sm" fill="#f6efe0">June 4, 12:00</text>

    <g transform="translate(236 46)">
      <text x="0" y="34" class="text-xl ink">Client overview</text>
      <text x="0" y="64" class="text-sm muted">Current report, session rhythm, and next actions in one workspace.</text>
      <rect x="594" y="4" width="84" height="34" rx="17" class="sage"/>
      <text x="617" y="26" class="text-sm" fill="#fffdf8">Active</text>

      <g transform="translate(0 112)">
        <rect class="panel" width="420" height="236" rx="18"/>
        <text x="28" y="42" class="text-lg ink">Sophia M.</text>
        <text x="28" y="70" class="text-sm muted">DAO / Bach / Wu Xing profile</text>
        <circle cx="330" cy="72" r="46" fill="#f4eadb"/>
        <path d="M330 27 A45 45 0 1 1 292 96" fill="none" stroke="#b88a55" stroke-width="10" stroke-linecap="round"/>
        <text x="311" y="78" class="text-md ink">72%</text>
        <line x1="28" y1="106" x2="392" y2="106" class="line"/>
        <text x="28" y="140" class="text-sm muted">Primary focus</text>
        <text x="28" y="166" class="text-md ink">Emotional regulation and grounding</text>
        <rect x="28" y="190" width="140" height="26" rx="13" fill="#f4eadb"/>
        <text x="48" y="208" class="text-xs" fill="#7a5834">Open full report</text>
      </g>

      <g transform="translate(448 112)">
        <rect class="panel" width="260" height="236" rx="18"/>
        <text x="24" y="42" class="text-lg ink">Next step</text>
        <rect x="24" y="70" width="212" height="62" rx="14" class="soft"/>
        <circle cx="52" cy="101" r="13" class="sage"/>
        <text x="78" y="96" class="text-sm ink">Complete check-in</text>
        <text x="78" y="116" class="text-xs muted">7 minutes</text>
        <rect x="24" y="148" width="212" height="54" rx="14" fill="#f8f2e9"/>
        <circle cx="52" cy="175" r="13" class="gold"/>
        <text x="78" y="171" class="text-sm ink">Review remedies</text>
        <text x="78" y="190" class="text-xs muted">3 items updated</text>
      </g>

      <g transform="translate(0 384)">
        <rect class="panel" width="708" height="190" rx="18"/>
        <text x="28" y="40" class="text-lg ink">Report timeline</text>
        <line x1="54" y1="92" x2="650" y2="92" stroke="#d8cbb6" stroke-width="3" stroke-linecap="round"/>
        <circle cx="78" cy="92" r="14" class="sage"/>
        <circle cx="240" cy="92" r="14" class="accent"/>
        <circle cx="402" cy="92" r="14" class="rose"/>
        <circle cx="564" cy="92" r="14" class="gold"/>
        <text x="52" y="132" class="text-xs muted">Intake</text>
        <text x="204" y="132" class="text-xs muted">Analysis</text>
        <text x="360" y="132" class="text-xs muted">Report</text>
        <text x="528" y="132" class="text-xs muted">Follow-up</text>
        <rect x="542" y="32" width="110" height="32" rx="16" fill="#f3eadc"/>
        <text x="564" y="53" class="text-xs" fill="#7a5834">On schedule</text>
      </g>
    </g>
  </g>

  <g transform="translate(1088 120)">
    <rect class="screen" width="270" height="586" rx="34"/>
    <rect x="22" y="20" width="226" height="546" rx="24" fill="#fffdf8"/>
    <text x="42" y="68" class="text-md ink">Overview</text>
    <text x="42" y="91" class="text-xs muted">Sophia M.</text>
    <rect x="42" y="118" width="186" height="118" rx="18" fill="#f7f1e7" stroke="#ded2c0"/>
    <text x="60" y="151" class="text-sm ink">Current report</text>
    <text x="60" y="177" class="text-lg ink">72%</text>
    <rect x="60" y="198" width="118" height="10" rx="5" fill="#e1d4bf"/>
    <rect x="60" y="198" width="86" height="10" rx="5" class="accent"/>
    <rect x="42" y="260" width="186" height="82" rx="18" class="sage"/>
    <text x="60" y="292" class="text-sm" fill="#fffdf8">Complete check-in</text>
    <text x="60" y="316" class="text-xs" fill="#d7e1d8">7 minutes</text>
    <text x="42" y="382" class="text-sm ink">Timeline</text>
    <line x1="66" y1="430" x2="206" y2="430" stroke="#d8cbb6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="72" cy="430" r="10" class="sage"/>
    <circle cx="118" cy="430" r="10" class="accent"/>
    <circle cx="164" cy="430" r="10" class="rose"/>
    <circle cx="206" cy="430" r="10" class="gold"/>
    <rect x="42" y="480" width="186" height="52" rx="16" fill="#f4eadb"/>
    <text x="60" y="512" class="text-xs" fill="#7a5834">Open full report</text>
  </g>
</svg>
