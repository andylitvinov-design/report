name: Deploy Production Fallback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: "main"
      expected_sha:
        description: "Expected commit SHA to verify before deploy"
        required: false
        default: ""
      reason:
        description: "Why this fallback deploy was triggered"
        required: false
        default: "fallback production deploy"
      production_url:
        description: "Production URL to verify after deploy"
        required: false
        default: "https://psitherapy.vercel.app/"

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL: "1"
      PRODUCTION_URL: ${{ inputs.production_url }}
      BUILD_INFO_URL: ${{ inputs.production_url }}build-info.json
      LEGACY_URL: https://andylitvinov-design.github.io/report/
      LEGACY_BUILD_INFO_URL: https://andylitvinov-design.github.io/report/build-info.json

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Print checked-out commit
        run: |
          echo "ref=${{ inputs.ref }}"
          echo "reason=${{ inputs.reason }}"
          echo "expected_sha=${{ inputs.expected_sha }}"
          echo "production_url=${{ inputs.production_url }}"
          echo "actual_sha=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Verify expected SHA if provided
        if: ${{ inputs.expected_sha != '' }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "${{ inputs.expected_sha }}" ]; then
            echo "Expected SHA does not match checked-out SHA"
            echo "expected=${{ inputs.expected_sha }}"
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

      - name: Verify Vercel secrets are configured
        run: |
          missing=0
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build check
        run: npm run build

      - name: Pull Vercel production environment
        run: npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build with Vercel
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to Vercel production
        run: |
          DEPLOY_URL="$(npx vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Vercel deploy URL: $DEPLOY_URL"

      - name: Wait for production alias
        run: sleep 60

      - name: Verify primary production URL responds
        run: curl -fsS --retry 6 --retry-delay 10 "$PRODUCTION_URL" >/dev/null

      - name: Verify primary build info responds
        run: curl -fsS --retry 6 --retry-delay 10 "$BUILD_INFO_URL" | tee /tmp/build-info.json

      - name: Verify build info commit if expected SHA provided
        if: ${{ inputs.expected_sha != '' }}
        run: |
          if ! grep -q "${{ inputs.expected_sha }}" /tmp/build-info.json; then
            echo "Live build-info does not contain expected SHA"
            echo "expected=${{ inputs.expected_sha }}"
            cat /tmp/build-info.json
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Deploy Fallback"
            echo "- Repository: ${{ github.repository }}"
            echo "- Platform: Vercel"
            echo "- Ref: ${{ inputs.ref }}"
            echo "- Expected SHA: ${{ inputs.expected_sha }}"
            echo "- Actual SHA: $(git rev-parse HEAD)"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Deploy URL: ${DEPLOY_URL:-unknown}"
            echo "- Primary URL: $PRODUCTION_URL"
            echo "- Primary Build Info URL: $BUILD_INFO_URL"
            echo "- Legacy URL: $LEGACY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
