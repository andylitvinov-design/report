name: Deploy client cabinet to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: VITE_BASE=/report/ npm run build

      - name: Print build info
        run: cat public/build-info.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for GitHub Pages propagation
        run: sleep 60

      - name: Verify GitHub Pages build info
        run: |
          BUILD_INFO_URL="${{ steps.deployment.outputs.page_url }}build-info.json"
          echo "Checking $BUILD_INFO_URL"
          curl -fsS --retry 6 --retry-delay 10 "$BUILD_INFO_URL" | tee /tmp/build-info.json
          if ! grep -q "${{ github.sha }}" /tmp/build-info.json; then
            echo "Legacy GitHub Pages build-info does not contain expected SHA"
            echo "expected=${{ github.sha }}"
            cat /tmp/build-info.json
            exit 1
          fi
